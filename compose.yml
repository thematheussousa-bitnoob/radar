# RadaR -- the agent's compose file.
#
# Copied from the example Plow publishes (plow-agents/compose.example.yml), in
# the read-only clone.
#
# The previous comment here said that "Plow's example does not ask for an agent
# identifier, and this house does not invent one". That was true about
# compose.example.yml and FALSE as a conclusion: `AGENT_ID` is in Plow's README,
# and without it the Agent Index reporter starts, warns that it has no one to
# report for, and sleeps 86400. The agent works the same and the scoreboard sees
# nothing.
services:
  agent:
    build: .
    # COMES BACK ON ITS OWN. Without this line the policy is `restart: no`,
    # measured with `docker inspect` on 17/09: the machine rebooted, the
    # container died at 21:11 and stayed dead. It came up at 21:20 because
    # someone opened the editor and went to look -- not because anything was
    # watching. There was already a fourteen-hour case found by chance, and the
    # difference between nine minutes and fourteen hours was when a person
    # happened to pass by.
    #
    # This matters MORE on the installer's machine than on ours: nobody is
    # going to look at `docker ps` on someone else's computer, and a reminder
    # whose time passes while the scheduler is down is deleted without notice
    # ([R-graca]). `unless-stopped` and not `always` on purpose: whoever stops
    # the agent on purpose asked for it to stop, and a machine reboot does not
    # undo that order.
    restart: unless-stopped
    # `AGENT_ID` DOES NOT LIVE HERE ANYMORE: it lives in the `Dockerfile`, baked
    # into the image. A cloud deploy does not run this file -- it brings the
    # image up on its own, with the provisioner's environment -- and an
    # `AGENT_ID` that only existed here would not get there. The agent would
    # work and the scoreboard would see nothing.
    #
    # THE CREDENTIAL COMES IN THROUGH THE ENVIRONMENT, no longer through a
    # mount. The base stopped promoting `/var/lib/plow/credentials.host` in
    # commit b78250e: whoever keeps mounting it is left with no credential at
    # all and `plow-init` parks. This is the shape of the `compose.example.yml`
    # Plow publishes.
    #
    # This is still the ONLY credential the container sees. The ACCOUNT
    # credential lives outside this folder and never comes in here.
    env_file:
      - path: ./plow-credentials
        required: false
    volumes:
      # The agent's home, kept between `up` and `down` -- sessions and config.
      #
      # An edit to the persona does NOT need `down -v`: `plow-init` composes
      # the identity inside the home on every boot, so `up --build -d` is
      # enough.
      #
      # `docker compose down -v` DELETES this volume. After registering on the
      # Index that is irreversible where it matters: the install id goes with
      # it, and the identity on the scoreboard changes. Use it only to discard
      # the agent on purpose.
      #
      # Corrected on 11/09/2026. The previous comment said to run `down -v` to
      # see a persona change -- it was the premise overturned on 09/09 turned
      # into a command, and that command is exactly what burns the identity.
      # Source: `plow-hermes-agent/compose.yml` in the read-only clone, which
      # says in so many words "An edit to SOUL.md does not need it".
      - agent-home:/var/lib/hermes
    # The agent saves state on SIGTERM; its supervisor gives it 30s, and
    # Docker's 10s default cuts it off midway and orphans the transcript.
    stop_grace_period: 35s
    # No ports: the agent connects outward, toward Plow.

volumes:
  agent-home:
